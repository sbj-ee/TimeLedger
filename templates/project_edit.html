{% extends "base.html" %}
{% block title %}Edit Project - Time Ledger{% endblock %}

{% block content %}
<h1>Edit Project</h1>

<div class="filter-bar">
    <form method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Name</label>
            <input type="text" name="name" value="{{ project.name }}" required style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Description</label>
            <input type="text" name="description" value="{{ project.description or '' }}" style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>
                <input type="checkbox" name="active" value="1" {{ 'checked' if project.active }}>
                Active
            </label>
        </div>
        <div class="form-row">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('projects') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
