{% extends "base.html" %}
{% block title %}Edit Entry - Time Ledger{% endblock %}

{% block content %}
<h1>Edit Entry</h1>

<div class="filter-bar">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Project</label>
                <select name="project_id" required>
                    {% for p in projects %}
                    <option value="{{ p.id }}" {{ 'selected' if entry.project_id == p.id }}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" value="{{ entry.date }}" required>
            </div>
            <div class="form-group">
                <label>Hours</label>
                <input type="number" name="hours" step="0.25" min="0.25" value="{{ entry.hours }}" required style="width: 80px;">
            </div>
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>Note</label>
            <input type="text" name="note" value="{{ entry.note or '' }}" style="width: 100%;">
        </div>
        <div class="form-row">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('entries') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
